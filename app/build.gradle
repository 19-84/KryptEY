apply plugin: 'com.android.application'

android {
    namespace 'com.amnesica.kryptey.inputmethod'
    compileSdk 35

    defaultConfig {
        applicationId "com.amnesica.kryptey"
        minSdk 26
        targetSdk 33
        versionCode 24
        versionName "0.1.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        // A baseline, not a suppression. It grandfathers the state the project was already in and
        // gates everything new.
        //
        // "NONE of them are in code this revival wrote" is what this said, and it was wrong by one:
        // a DataExtractionRules entry points at the android:dataExtractionRules attribute the
        // revival itself added. Checked rather than removed, because the sentence beside it says an
        // entry here is a finding nobody sees again - and this one is a false positive. The app
        // writes nothing outside its data directory, the settings preferences live in
        // device-protected storage, and both the cloud-backup and device-transfer rules exclude
        // root and device_root with no include. allowBackup is false besides, which on API 26-30
        // disables Auto Backup and adb backup outright. The lint suggestion is to add
        // fullBackupContent, i.e. a second rules file that would have to stay consistent with the
        // first, and the guard that asserts these rules reads one file.
        //
        // Regenerate deliberately with `gradlew updateLintBaseline`, never to make a red build green:
        // an entry added here is a finding nobody will see again.
        baseline = file("lint-baseline.xml")
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            // libsignal ships a test-only native library alongside the real one - 82 MB per ABI on
            // arm64. Nothing in the app references it.
            excludes += ['**/libsignal_jni_testing.so']
        }
        resources {
            // The same jar also carries libsignal's DESKTOP builds - macOS .dylib and Windows .dll,
            // each in a normal and a "_testing_" flavour - at the jar root. They are java resources
            // rather than jniLibs, so the exclusion above never saw them, and they were packaged
            // into every release APK: six files, 42.6 MB of the artifact, none of which can be
            // loaded by Android at all.
            //
            // Two of the six are testing builds of the crypto library. They are inert on a phone,
            // but shipping a test build of libsignal inside the release artifact is not something
            // to do by accident.
            //
            // These are still needed to RUN the unit tests - Robolectric executes on the JVM and
            // libsignal loads the desktop build there - which is why they must be excluded from
            // packaging rather than from the dependency. The test classpath reads them from the jar
            // and is unaffected by this block.
            excludes += ['*.dylib', '*.dll', '**/*.dylib', '**/*.dll']
        }
        // And the attribution file for the testing binary, which is not a native library and so
        // survived the exclusion above.
        //
        // libsignal ships one acknowledgments document per flavour, and the testing one differs
        // from the real one by a single line - the crate list, naming libsignal-jni-testing. It is
        // 44.7 KB of a release APK that deliberately excludes the binary it describes, so "the
        // testing flavour is out of the artifact" was not quite true.
        //
        // By exact path, not by an acknowledgments pattern: these are third-party attribution for
        // an AGPL dependency distributed through F-Droid, and dropping the wrong one trades 44 KB
        // for a licence problem.
        androidResources {
            ignoreAssetsPattern '!libsignal-testing.md' 
        }
    }

    splits {
        abi {
            // libsignal 0.86.5 is ~74 MB of native code per ABI. A universal APK carrying all four
            // would be unusable, so ship one APK per ABI.
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            // Emulators are x86_64 and real devices are not, so x86_64 is not shipped - but
            // without it the instrumentation tests cannot run anywhere, because libsignal's
            // native code is what they exist to exercise. -PemulatorAbi adds it for a local
            // run only; no release build sets it, and verifyReleaseNativesStripped still sees
            // whatever is produced.
            if (project.hasProperty('emulatorAbi')) {
                include 'x86_64'
            }
            universalApk false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Required by libsignal 0.86.5, which uses JDK APIs not present at minSdk 26.
        coreLibraryDesugaringEnabled true
    }

    // The instrumentation tests must at least keep compiling.
    //
    // They are the only coverage of the real Android Keystore - the seal/open round trip against a
    // hardware-backed key, the StrongBox ladder, CALLER_NONCE_PROHIBITED - and of whether the
    // platform will bind a service declared exported="false" as an input method.
    //
    // This comment used to say they could not run here at all: no /dev/kvm, no virtualisation
    // extensions, "not slow but impossible". That was wrong - KVM is an accelerator, and QEMU
    // without one emulates the guest in software. tools/test-on-emulator runs them.
    //
    // They still do not run in THIS task, which is why the dependency below exists: an emulator run
    // takes ten minutes and nobody does it on every edit, so a change to Account or StorageHelper
    // could break them and the JVM suite would stay green for months. Making testDebugUnitTest
    // depend on their compilation costs a few seconds and turns silent rot into a build failure.
    tasks.matching { it.name == 'testDebugUnitTest' }.configureEach {
        dependsOn 'compileDebugAndroidTestJavaWithJavac'
        // ReleasePackagingTest reads this build script at run time to check that libsignal's
        // desktop binaries stay excluded from the APK. Gradle has no way to know that, so without
        // this line the task stays UP-TO-DATE when the script changes and the test replays its last
        // result. That is not theoretical: two controls against this file "survived" until the task
        // was forced to re-run, and the test had been biting correctly all along.
        inputs.file('build.gradle').withPathSensitivity(PathSensitivity.RELATIVE)
        // RevivalIndexIsCompleteTest reads REVIVAL.md the same way, and the same rule applies: a
        // file a test reads at run time but Gradle does not know about leaves the task UP-TO-DATE
        // and replays the last result. That already cost two controls on this branch which reported
        // "survived" against a test that was biting correctly.
        inputs.file('../REVIVAL.md').withPathSensitivity(PathSensitivity.RELATIVE)
        // The settled-claims ledger, for the same reason: a guard reads it to check that a claim
        // refuted against one libsignal version still names the version the build pins, and without
        // this the task stays UP-TO-DATE when the ledger changes and replays its last result. That
        // is not hypothetical - it was measured on this very guard, whose mutant survived until
        // this line existed.
        inputs.file('../REVIEW-SETTLED.md').withPathSensitivity(PathSensitivity.RELATIVE)
        // BACKLOG.md and the lint baseline, because DocsDoNotContradictTheAppTest reads both to
        // check that the backlog's summary of the baseline matches the baseline. Undeclared, the
        // test task stays UP-TO-DATE when either changes and the guard replays its last result -
        // the trap EveryFileATestReadsIsATaskInputTest exists for, walked into while writing that
        // very check: a control that drifted the quoted figure came back green because the task
        // never ran.
        inputs.file('../BACKLOG.md').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('lint-baseline.xml').withPathSensitivity(PathSensitivity.RELATIVE)
        // EverySerialisedClassIsKeptTest reads the rules to learn which packages are kept.
        inputs.file('proguard-rules.pro').withPathSensitivity(PathSensitivity.RELATIVE)
        // DependencyVerificationIsOnTest reads both to check that verification is still on. Neither
        // was tracked, so that guard could replay a stale pass while somebody turned it off - and
        // the guard against undeclared inputs could not see them either, because its literal scan
        // had no .properties in its extension list and build-in-docker has no extension at all.
        inputs.file('../gradle.properties').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('../tools/build-in-docker').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('../tools/verify-cold').withPathSensitivity(PathSensitivity.RELATIVE)
        // TheWrapperThatRunsEverythingIsPinnedTest reads both. The jar runs before dependency
        // verification and before the distribution checksum - it is the code that enforces that
        // checksum - so a guard on it that could replay a stale pass would be worth very little.
        inputs.file('../gradle/wrapper/gradle-wrapper.jar').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('../gradle/wrapper/gradle-wrapper.properties').withPathSensitivity(PathSensitivity.RELATIVE)
        // TheImageDescriptionMatchesTheImageTest reads the Dockerfile that defines the build image.
        inputs.file('../tools/Dockerfile').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('../README.md').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('../HELP.md').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('../KRYPTEY.md').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('../fastlane/metadata/android/en-US/full_description.txt').withPathSensitivity(PathSensitivity.RELATIVE)
        // InstrumentationTestsCleanUpTheKeystoreTest reads these at run time. dependsOn compiles
        // them but does not make them inputs, so without this the task stays UP-TO-DATE when they
        // change and replays its last result - which it did, reporting a removed @After cleanup as
        // "survived".
        inputs.dir('src/androidTest/java').withPathSensitivity(PathSensitivity.RELATIVE)
        // ReleaseManifestHasNoTestScaffoldingTest reads these two source sets to check that the
        // instrumentation scaffolding cannot reach a release build. Neither is on the unit-test
        // compile path, so without these a file moved out of src/debug - the exact defect the test
        // exists to catch - would replay the previous pass. Seventh instance of that trap here.
        inputs.dir('src/debug/java').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('src/debug/AndroidManifest.xml').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('src/main/AndroidManifest.xml').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('../gradle/verification-metadata.xml').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('../tools/README.md').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('../.github/workflows/build.yml').withPathSensitivity(PathSensitivity.RELATIVE)
    }

    testOptions {
        unitTests {
            // Required by Robolectric. Deliberately does NOT set returnDefaultValues: unmocked
            // android.jar calls must keep throwing loudly rather than silently returning 0/null.
            includeAndroidResources = true

            all {
                systemProperty 'kryptey.writeFixtures',
                        System.getProperty('kryptey.writeFixtures', 'false')

                // -Dkryptey.isolateClasses=true --rerun-tasks runs every test class in a fresh JVM.
                //
                // This suite shares a singleton with static test seams - testIsRunning,
                // storageStateForTest, storageHelperFactory - and only 24 of its ~112 classes call
                // resetForTest. State left set by one class is therefore visible to the next, and a
                // test that passes because of it is indistinguishable from one that passes on its
                // own merits. Isolation makes that leak impossible, so a difference between the two
                // runs is exactly the set of tests that were relying on it.
                //
                // Opt-in because it costs about seven minutes against under two: the JVM start
                // dominates. Worth running when tests start passing for reasons that are not
                // obvious.
                if (System.getProperty('kryptey.isolateClasses') == 'true') {
                    forkEvery = 1
                }
            }
        }
    }

}

dependencies {
    // Jackson versions are aligned by the BOM so databind/core/annotations/jsr310
    // can never drift apart. Bumping the BOM bumps the whole family.
    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.2')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation 'org.signal:libsignal-android:0.86.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
    // Runs the real SharedPreferences implementation on the JVM, so the storage layer that actually
    // touches Android APIs is covered by tests that execute rather than tests that only compile.
    testImplementation 'org.robolectric:robolectric:4.16.1'

    // Instrumentation tests. These are the ONLY way to exercise AndroidKeystoreCryptoBox: a desktop
    // JCE key and a Keystore key have materially different semantics (a Keystore key rejects a
    // caller-supplied IV, which already hid one production-only failure), so JVM tests cannot
    // stand in for them. They need a device or an emulator.
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
}

// ---------------------------------------------------------------------------------------------
// Release artifacts must not carry native debug symbols.
//
// This is a gate rather than a warning because AGP already warns and nobody sees it. Its
// stripReleaseDebugSymbols task prints "Unable to strip the following libraries, packaging them as
// they are" and the build still reports success, so a host with no NDK silently produces an APK
// roughly seven times the size of one built where stripping works - 64.2 MB of DWARF against a
// .text of 4.7 MB, measured. The same source then yields materially different artifacts depending
// on the machine, which is a reproducibility problem for a project distributed through F-Droid.
//
// It also cost a decision. REVIVAL.md carried "APK size accepted at 115 MB ... that is the cost of
// PQXDH" as SETTLED, on a premise nobody had measured; the real cost is around 10 MB. A settled
// entry is one nobody revisits, so the silence is what made it durable.
//
// Detection reads the ELF section headers. An earlier version searched the raw bytes for the
// string ".debug_info", which was wrong in the direction that matters: llvm-strip removes the
// DWARF sections but leaves their NAMES in the section-header string table, so a correctly
// stripped library still contains that substring and the gate failed every build. It was
// controlled in both directions when written - unstripped fails, a marker that exists nowhere
// passes - but not at first against a genuinely stripped library, because the image had no NDK to
// produce one, and a synthetic negative is not a negative. The image has one now
// (tools/Dockerfile installs it), and the shipped library measures clean: no .debug section of any
// kind in libsignal_jni.so, .text 4,705,420 bytes. The gate has since been exercised against a real
// stripped binary, which is what that paragraph was waiting for.
tasks.register('verifyReleaseNativesStripped') {
    description = 'Fails if a release APK carries native libraries with DWARF debug sections.'
    group = 'verification'
    doLast {
        def apks = fileTree("$buildDir/outputs/apk/release") { include '**/*.apk' }.files
        if (apks.isEmpty()) {
            throw new GradleException('no release APK found; run assembleRelease first')
        }
        def le = { byte[] b, int off, int width ->
            long v = 0
            for (int i = width - 1; i >= 0; i--) { v = (v << 8) | (b[off + i] & 0xff) }
            return v
        }
        def debugBytesIn = { byte[] b ->
            if (b.length < 64 || b[0] != (byte) 0x7f || b[1] != (byte) 'E') return -1L
            boolean elf64 = b[4] == 2
            long shoff = elf64 ? le(b, 0x28, 8) : le(b, 0x20, 4)
            int shentsize = (int) (elf64 ? le(b, 0x3a, 2) : le(b, 0x2e, 2))
            int shnum = (int) (elf64 ? le(b, 0x3c, 2) : le(b, 0x30, 2))
            int shstrndx = (int) (elf64 ? le(b, 0x3e, 2) : le(b, 0x32, 2))
            if (shoff <= 0 || shnum <= 0 || shstrndx >= shnum) return -1L
            def header = { int i ->
                long off = shoff + (long) i * shentsize
                long nameOff = le(b, (int) off, 4)
                long secOff = elf64 ? le(b, (int) off + 0x18, 8) : le(b, (int) off + 0x10, 4)
                long size = elf64 ? le(b, (int) off + 0x20, 8) : le(b, (int) off + 0x14, 4)
                return [nameOff, secOff, size]
            }
            def strTab = header(shstrndx)
            long total = 0
            for (int i = 0; i < shnum; i++) {
                def h = header(i)
                int nameAt = (int) (strTab[1] + h[0])
                if (nameAt < 0 || nameAt >= b.length) continue
                int end2 = nameAt
                while (end2 < b.length && b[end2] != 0) end2++
                String name = new String(b, nameAt, end2 - nameAt, 'US-ASCII')
                if (name.startsWith('.debug')) total += h[2]
            }
            return total
        }
        def offenders = []
        apks.each { apk ->
            new java.util.zip.ZipFile(apk).withCloseable { zip ->
                zip.entries().findAll { it.name.endsWith('.so') }.each { entry ->
                    def bytes = zip.getInputStream(entry).bytes
                    long dwarf = debugBytesIn(bytes)
                    if (dwarf > 0) {
                        offenders << "${apk.name}: ${entry.name} carries ${(long) (dwarf / 1e6)} MB of DWARF"
                    } else if (dwarf < 0) {
                        offenders << "${apk.name}: ${entry.name} is not a parseable ELF - refusing to guess"
                    }
                }
            }
        }
        if (!offenders.isEmpty()) {
            def message = 'release APKs carry unstripped native libraries:\n  '\
                + offenders.join('\n  ')\
                + '\n\nAGP could not strip them - its stripReleaseDebugSymbols task warns and\n'\
                + 'continues, so this would otherwise ship silently. Install the NDK so stripping\n'\
                + 'works, or pass -Pkryptey.allowUnstrippedNatives=true to state deliberately that\n'\
                + 'this artifact is not for distribution.'
            if (project.hasProperty('kryptey.allowUnstrippedNatives')) {
                logger.lifecycle("verifyReleaseNativesStripped: ALLOWED BY FLAG\n" + message)
            } else {
                throw new GradleException(message)
            }
        }
    }
}

/**
 * What the shipped artifact actually contains, asserted against the artifact.
 *
 * Every other release guard in this project is a source or build-script scan, and one of them
 * opens with "the shipped manifest is a security artefact" and then reads the DEBUG merged
 * manifest - which carries EditableFieldActivity, RecordingAutofillService and
 * android:debuggable="true". Those assertions were being made about a variant that is not shipped,
 * so a release-only manifest contribution (a releaseImplementation dependency declaring INTERNET,
 * say) was caught by nothing.
 *
 * This runs where the artifact exists and where a failure stops the build, which is the same
 * reason the native-strip gate lives here rather than in a unit test: a test that opens
 * outputs/apk/release would be skipped whenever no APK had been built, and would pass on a stale
 * one the rest of the time.
 */
tasks.register('verifyReleaseArtifactContents') {
    description = 'Fails if the release manifest or APK contains what release must not contain.'
    group = 'verification'
    doLast {
        def manifests = fileTree("$buildDir/intermediates/packaged_manifests/release") {
            include '**/AndroidManifest.xml'
        }.files
        if (manifests.isEmpty()) {
            throw new GradleException('no merged release manifest found; run assembleRelease first')
        }

        def offenders = []
        manifests.each { manifest ->
            def text = manifest.text
            // The claim this project makes most loudly, checked against the thing it is about.
            def permitted = ['android.permission.VIBRATE']
            (text =~ /uses-permission[^>]*android:name="([^"]+)"/).each { whole, name ->
                if (!permitted.contains(name)) {
                    offenders << "release manifest requests ${name}; this app is meant to have no "                        + "way to reach the network or anything outside itself"
                }
            }
            // ForeignAppActivity is deliberately absent from this list. It is declared in the
            // androidTest manifest, which merges into com.amnesica.kryptey.test - a separate
            // package with no path into the release manifest - so checking for it here was a name
            // that could not appear in the file being scanned. A check that cannot fail reads as
            // coverage it does not provide, and ReleaseManifestHasNoTestScaffoldingTest already
            // derives the real set from src/debug/java rather than from a hand-written array.
            ['RecordingAutofillService', 'EditableFieldActivity'].each { name ->
                if (text.contains(name)) {
                    offenders << "release manifest declares test scaffolding: ${name}"
                }
            }
            if (text.contains('android:debuggable="true"')) {
                offenders << 'release manifest is debuggable'
            }
            if (!text.contains('android:allowBackup="false"')) {
                offenders << 'release manifest does not set allowBackup="false"'
            }
            // allowBackup="false" disables cloud backup and, on Android 12+, does NOT disable
            // device-to-device transfer - that needs the extraction rules. minSdk is 26, so
            // allowBackup covers 26 to 30 and this attribute is the only thing covering 31 and up.
            // It was asserted by nothing: NothingLeavesTheDeviceTest reads the rules FILE off the
            // filesystem and never the manifest, so deleting the attribute left every check green
            // while the transferred store arrived with its firstrun flag intact - a permanently
            // non-functional keyboard with no reset path, which is what the rules file's own
            // comment spends a paragraph on.
            if (!text.contains('android:dataExtractionRules=')) {
                offenders << 'release manifest sets no dataExtractionRules; allowBackup="false" '
                    + 'does not stop device-to-device transfer on Android 12 and up'
            }
            // The two manifest facts this app's threat model rests on, checked against the variant
            // that actually ships. Both were asserted only against the DEBUG merged manifest, which
            // is the gap this whole task was written for.
            if (!text.contains('android:permission="android.permission.BIND_INPUT_METHOD"')) {
                offenders << 'release manifest does not bind the IME service to '
                    + 'BIND_INPUT_METHOD; any app could bind it'
            }
            def exported = (text =~ /android:exported="true"/).count
            if (exported != 1) {
                offenders << "release manifest exports ${exported} components; exactly one "
                    + '(SettingsActivity, for the launcher) is intended'
            }
        }

        fileTree("$buildDir/outputs/apk/release") { include '**/*.apk' }.files.each { apk ->
            new java.util.zip.ZipFile(apk).withCloseable { zip ->
                zip.entries().findAll { it.name.toLowerCase().contains('testing') }.each { entry ->
                    offenders << "${apk.name} carries ${entry.name}, a testing-flavour artefact"
                }
            }
        }

        if (!offenders.isEmpty()) {
            throw new GradleException('the release artifact contains what release must not:\n  '
                + offenders.join('\n  '))
        }
    }
}

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    finalizedBy 'verifyReleaseNativesStripped'
    finalizedBy 'verifyReleaseArtifactContents'
}
