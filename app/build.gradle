apply plugin: 'com.android.application'

android {
    namespace 'com.amnesica.kryptey.inputmethod'
    compileSdk 35

    defaultConfig {
        applicationId "com.amnesica.kryptey"
        minSdk 26
        targetSdk 33
        versionCode 24
        versionName "0.1.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        // A baseline, not a suppression. lint reports 100 errors and 503 warnings, and NONE of them
        // are in code this revival wrote - 77 are in files it never touched, and the other 23 are
        // MissingTranslation on strings that exist in master. So this grandfathers exactly the state
        // the project was already in, and gates everything new.
        //
        // Regenerate deliberately with `gradlew updateLintBaseline`, never to make a red build green:
        // an entry added here is a finding nobody will see again.
        baseline = file("lint-baseline.xml")
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            // libsignal ships a test-only native library alongside the real one - 82 MB per ABI on
            // arm64. Nothing in the app references it.
            excludes += ['**/libsignal_jni_testing.so']
        }
        resources {
            // The same jar also carries libsignal's DESKTOP builds - macOS .dylib and Windows .dll,
            // each in a normal and a "_testing_" flavour - at the jar root. They are java resources
            // rather than jniLibs, so the exclusion above never saw them, and they were packaged
            // into every release APK: six files, 42.6 MB of the artifact, none of which can be
            // loaded by Android at all.
            //
            // Two of the six are testing builds of the crypto library. They are inert on a phone,
            // but shipping a test build of libsignal inside the release artifact is not something
            // to do by accident.
            //
            // These are still needed to RUN the unit tests - Robolectric executes on the JVM and
            // libsignal loads the desktop build there - which is why they must be excluded from
            // packaging rather than from the dependency. The test classpath reads them from the jar
            // and is unaffected by this block.
            excludes += ['*.dylib', '*.dll', '**/*.dylib', '**/*.dll']
        }
    }

    splits {
        abi {
            // libsignal 0.86.5 is ~74 MB of native code per ABI. A universal APK carrying all four
            // would be unusable, so ship one APK per ABI.
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            // Emulators are x86_64 and real devices are not, so x86_64 is not shipped - but
            // without it the instrumentation tests cannot run anywhere, because libsignal's
            // native code is what they exist to exercise. -PemulatorAbi adds it for a local
            // run only; no release build sets it, and verifyReleaseNativesStripped still sees
            // whatever is produced.
            if (project.hasProperty('emulatorAbi')) {
                include 'x86_64'
            }
            universalApk false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Required by libsignal 0.86.5, which uses JDK APIs not present at minSdk 26.
        coreLibraryDesugaringEnabled true
    }

    // The instrumentation tests must at least keep compiling.
    //
    // They are the only coverage of the real Android Keystore - the seal/open round trip against a
    // hardware-backed key, the StrongBox ladder, CALLER_NONCE_PROHIBITED - and they cannot run here:
    // there is no /dev/kvm and the host exposes no virtualisation extensions, so an emulator is not
    // slow but impossible. That makes them uniquely easy to rot. Nothing compiles androidTest during
    // an ordinary test run, so a change to Account or StorageHelper could break them and the suite
    // would stay green for months.
    //
    // Making the unit-test task depend on their compilation costs a few seconds and turns silent rot
    // into a build failure. It does NOT make them run, and nothing here should be read as claiming
    // they have.
    tasks.matching { it.name == 'testDebugUnitTest' }.configureEach {
        dependsOn 'compileDebugAndroidTestJavaWithJavac'
        // ReleasePackagingTest reads this build script at run time to check that libsignal's
        // desktop binaries stay excluded from the APK. Gradle has no way to know that, so without
        // this line the task stays UP-TO-DATE when the script changes and the test replays its last
        // result. That is not theoretical: two controls against this file "survived" until the task
        // was forced to re-run, and the test had been biting correctly all along.
        inputs.file('build.gradle').withPathSensitivity(PathSensitivity.RELATIVE)
        // RevivalIndexIsCompleteTest reads REVIVAL.md the same way, and the same rule applies: a
        // file a test reads at run time but Gradle does not know about leaves the task UP-TO-DATE
        // and replays the last result. That already cost two controls on this branch which reported
        // "survived" against a test that was biting correctly.
        inputs.file('../REVIVAL.md').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('../README.md').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('../HELP.md').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('../KRYPTEY.md').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('../fastlane/metadata/android/en-US/full_description.txt').withPathSensitivity(PathSensitivity.RELATIVE)
        // InstrumentationTestsCleanUpTheKeystoreTest reads these at run time. dependsOn compiles
        // them but does not make them inputs, so without this the task stays UP-TO-DATE when they
        // change and replays its last result - which it did, reporting a removed @After cleanup as
        // "survived".
        inputs.dir('src/androidTest/java').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('../gradle/verification-metadata.xml').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('../tools/README.md').withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file('../.github/workflows/build.yml').withPathSensitivity(PathSensitivity.RELATIVE)
    }

    testOptions {
        unitTests {
            // Required by Robolectric. Deliberately does NOT set returnDefaultValues: unmocked
            // android.jar calls must keep throwing loudly rather than silently returning 0/null.
            includeAndroidResources = true

            all {
                systemProperty 'kryptey.writeFixtures',
                        System.getProperty('kryptey.writeFixtures', 'false')

                // -Dkryptey.isolateClasses=true --rerun-tasks runs every test class in a fresh JVM.
                //
                // This suite shares a singleton with static test seams - testIsRunning,
                // storageStateForTest, storageHelperFactory - and only 24 of its ~112 classes call
                // resetForTest. State left set by one class is therefore visible to the next, and a
                // test that passes because of it is indistinguishable from one that passes on its
                // own merits. Isolation makes that leak impossible, so a difference between the two
                // runs is exactly the set of tests that were relying on it.
                //
                // Opt-in because it costs about seven minutes against under two: the JVM start
                // dominates. Worth running when tests start passing for reasons that are not
                // obvious.
                if (System.getProperty('kryptey.isolateClasses') == 'true') {
                    forkEvery = 1
                }
            }
        }
    }

}

dependencies {
    // Jackson versions are aligned by the BOM so databind/core/annotations/jsr310
    // can never drift apart. Bumping the BOM bumps the whole family.
    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.2')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation 'org.signal:libsignal-android:0.86.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
    // Runs the real SharedPreferences implementation on the JVM, so the storage layer that actually
    // touches Android APIs is covered by tests that execute rather than tests that only compile.
    testImplementation 'org.robolectric:robolectric:4.16.1'

    // Instrumentation tests. These are the ONLY way to exercise AndroidKeystoreCryptoBox: a desktop
    // JCE key and a Keystore key have materially different semantics (a Keystore key rejects a
    // caller-supplied IV, which already hid one production-only failure), so JVM tests cannot
    // stand in for them. They need a device or an emulator.
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
}

// ---------------------------------------------------------------------------------------------
// Release artifacts must not carry native debug symbols.
//
// This is a gate rather than a warning because AGP already warns and nobody sees it. Its
// stripReleaseDebugSymbols task prints "Unable to strip the following libraries, packaging them as
// they are" and the build still reports success, so a host with no NDK silently produces an APK
// roughly seven times the size of one built where stripping works - 64.2 MB of DWARF against a
// .text of 4.7 MB, measured. The same source then yields materially different artifacts depending
// on the machine, which is a reproducibility problem for a project distributed through F-Droid.
//
// It also cost a decision. REVIVAL.md carried "APK size accepted at 115 MB ... that is the cost of
// PQXDH" as SETTLED, on a premise nobody had measured; the real cost is around 10 MB. A settled
// entry is one nobody revisits, so the silence is what made it durable.
//
// Detection reads the ELF section headers. An earlier version searched the raw bytes for the
// string ".debug_info", which was wrong in the direction that matters: llvm-strip removes the
// DWARF sections but leaves their NAMES in the section-header string table, so a correctly
// stripped library still contains that substring and the gate failed every build. It was
// controlled in both directions when written - unstripped fails, a marker that exists nowhere
// passes - but never against a genuinely stripped library, because this image had no NDK to
// produce one. A synthetic negative is not a negative.
tasks.register('verifyReleaseNativesStripped') {
    description = 'Fails if a release APK carries native libraries with DWARF debug sections.'
    group = 'verification'
    doLast {
        def apks = fileTree("$buildDir/outputs/apk/release") { include '**/*.apk' }.files
        if (apks.isEmpty()) {
            throw new GradleException('no release APK found; run assembleRelease first')
        }
        def le = { byte[] b, int off, int width ->
            long v = 0
            for (int i = width - 1; i >= 0; i--) { v = (v << 8) | (b[off + i] & 0xff) }
            return v
        }
        def debugBytesIn = { byte[] b ->
            if (b.length < 64 || b[0] != (byte) 0x7f || b[1] != (byte) 'E') return -1L
            boolean elf64 = b[4] == 2
            long shoff = elf64 ? le(b, 0x28, 8) : le(b, 0x20, 4)
            int shentsize = (int) (elf64 ? le(b, 0x3a, 2) : le(b, 0x2e, 2))
            int shnum = (int) (elf64 ? le(b, 0x3c, 2) : le(b, 0x30, 2))
            int shstrndx = (int) (elf64 ? le(b, 0x3e, 2) : le(b, 0x32, 2))
            if (shoff <= 0 || shnum <= 0 || shstrndx >= shnum) return -1L
            def header = { int i ->
                long off = shoff + (long) i * shentsize
                long nameOff = le(b, (int) off, 4)
                long secOff = elf64 ? le(b, (int) off + 0x18, 8) : le(b, (int) off + 0x10, 4)
                long size = elf64 ? le(b, (int) off + 0x20, 8) : le(b, (int) off + 0x14, 4)
                return [nameOff, secOff, size]
            }
            def strTab = header(shstrndx)
            long total = 0
            for (int i = 0; i < shnum; i++) {
                def h = header(i)
                int nameAt = (int) (strTab[1] + h[0])
                if (nameAt < 0 || nameAt >= b.length) continue
                int end2 = nameAt
                while (end2 < b.length && b[end2] != 0) end2++
                String name = new String(b, nameAt, end2 - nameAt, 'US-ASCII')
                if (name.startsWith('.debug')) total += h[2]
            }
            return total
        }
        def offenders = []
        apks.each { apk ->
            new java.util.zip.ZipFile(apk).withCloseable { zip ->
                zip.entries().findAll { it.name.endsWith('.so') }.each { entry ->
                    def bytes = zip.getInputStream(entry).bytes
                    long dwarf = debugBytesIn(bytes)
                    if (dwarf > 0) {
                        offenders << "${apk.name}: ${entry.name} carries ${(long) (dwarf / 1e6)} MB of DWARF"
                    } else if (dwarf < 0) {
                        offenders << "${apk.name}: ${entry.name} is not a parseable ELF - refusing to guess"
                    }
                }
            }
        }
        if (!offenders.isEmpty()) {
            def message = 'release APKs carry unstripped native libraries:\n  '\
                + offenders.join('\n  ')\
                + '\n\nAGP could not strip them - its stripReleaseDebugSymbols task warns and\n'\
                + 'continues, so this would otherwise ship silently. Install the NDK so stripping\n'\
                + 'works, or pass -Pkryptey.allowUnstrippedNatives=true to state deliberately that\n'\
                + 'this artifact is not for distribution.'
            if (project.hasProperty('kryptey.allowUnstrippedNatives')) {
                logger.lifecycle("verifyReleaseNativesStripped: ALLOWED BY FLAG\n" + message)
            } else {
                throw new GradleException(message)
            }
        }
    }
}

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    finalizedBy 'verifyReleaseNativesStripped'
}
