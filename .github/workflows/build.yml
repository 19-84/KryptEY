name: build

on:
  push:
    branches: [ master, revival ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags. Tags are mutable: the tj-actions/changed-files
      # compromise in 2025 worked by retagging, and this workflow will eventually hold an APK
      # signing keystore. The trailing comment records which release each SHA corresponds to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # Robolectric fetches android-all jars at runtime into ~/.m2 rather than the Gradle cache,
      # so without this every run re-downloads them.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle') }}

      # Dependency verification is enforced (gradle/verification-metadata.xml pins ~368 artifacts
      # by SHA-256). Deliberately NOT disabled here - CI is where a substituted artifact should be
      # caught, so a verification failure must fail the build.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
