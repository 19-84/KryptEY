name: build

on:
  push:
    branches: [ master, revival ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags. Tags are mutable: the tj-actions/changed-files
      # compromise in 2025 worked by retagging, and this workflow will eventually hold an APK
      # signing keystore. The trailing comment records which release each SHA corresponds to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 21 rather than 17: lint crashes on 17 (BidirectionalTextDetector calls a Java 21 API), so the
      # Lint step below could never pass. See tools/Dockerfile for the full reasoning.
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # Kept, and no longer true of the pinned version - which matters, because a review round read
      # this comment and reported that those jars run unverified in the job that builds the release
      # APK. The reasoning was right about older Robolectric: an android-all jar fetched at test time
      # lands outside Gradle's resolution and so outside dependency verification.
      #
      # Measured against Robolectric 4.16.1 as pinned here: the suite runs to completion with
      # --rerun-tasks in a container started with --network none, no android-all jar exists anywhere
      # in the image before or after, and no ~/.m2 is created at all. Its Android runtime comes from
      # nativeruntime and shadows-framework, both pinned and verified.
      #
      # The step stays because a future Robolectric could reintroduce the fetch, and because a cache
      # that hits nothing costs nothing. If it ever starts hitting, this comment is where to check
      # whether what it caches is verified.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle') }}

      # Dependency verification is enforced (gradle/verification-metadata.xml pins 386 artifacts
      # by SHA-256). Deliberately NOT disabled here - CI is where a substituted artifact should be
      # caught, so a verification failure must fail the build.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      # assembleRelease is finalized by verifyReleaseNativesStripped, which FAILS if a packaged
      # .so still carries DWARF debug sections. That is deliberate: AGP only warns when it cannot
      # strip, so an unstripped artifact otherwise ships in silence at roughly seven times the size
      # (64 MB of DWARF against a 4.7 MB .text, measured), and the same source then produces
      # materially different APKs depending on the build host.
      #
      # Stripping needs the NDK. If this step fails here with "release APKs carry unstripped native
      # libraries", the fix is to make an NDK available to the runner - NOT to pass
      # -Pkryptey.allowUnstrippedNatives=true. That flag exists for environments which cannot strip
      # at all, such as this project's own container, and it is an explicit statement that the
      # artifact is not for distribution. CI is the one place that statement must never be made
      # quietly.
      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
