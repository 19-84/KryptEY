name: build

on:
  push:
    branches: [ master, revival ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags. Tags are mutable: the tj-actions/changed-files
      # compromise in 2025 worked by retagging, and this workflow will eventually hold an APK
      # signing keystore. The trailing comment records which release each SHA corresponds to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 21 rather than 17: lint crashes on 17 (BidirectionalTextDetector calls a Java 21 API), so the
      # Lint step below could never pass. See tools/Dockerfile for the full reasoning.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        # Held at v5 on purpose. v6 changes the licence terms: upgrading means accepting Gradle's
        # Terms of Use for its caching component, which is the project owner's call to make.

      # No Robolectric cache step. One used to cache ~/.m2/repository/org/robolectric, and it was
      # live: runs restored 583 MB to 952 MB of android-all jars that Robolectric had downloaded
      # outside dependency verification, keyed only on app/build.gradle. Robolectric uses a jar it
      # finds there without checking it, so a poisoned entry would have been trusted outright, in
      # the job that builds the release APK. The suite now runs Robolectric in offline mode against
      # jars Gradle resolves and verification-metadata.xml pins (app/build.gradle,
      # RobolectricRunsOfflineTest), so there is nothing to download and nothing to cache. If
      # Robolectric ever needs a jar that is not pinned, the Unit tests step fails naming it. Do not
      # answer that failure by adding a cache back.

      # Dependency verification is enforced (gradle/verification-metadata.xml pins 280 artifacts
      # by SHA-256). Deliberately NOT disabled here - CI is where a substituted artifact should be
      # caught, so a verification failure must fail the build.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      # assembleRelease is finalized by verifyReleaseNativesStripped, which FAILS if a packaged
      # .so still carries DWARF debug sections. That is deliberate: AGP only warns when it cannot
      # strip, so an unstripped artifact otherwise ships in silence at roughly seven times the size
      # (64 MB of DWARF against a 4.7 MB .text, measured), and the same source then produces
      # materially different APKs depending on the build host.
      #
      # Stripping needs the NDK. If this step fails here with "release APKs carry unstripped native
      # libraries", the fix is to make an NDK available to the runner - NOT to pass
      # -Pkryptey.allowUnstrippedNatives=true. That flag exists for environments which cannot strip
      # at all, and it is an explicit statement that the artifact is not for distribution. CI is the
      # one place that statement must never be made quietly.
      #
      # This used to name "this project's own container" as such an environment. It is not one, and
      # has not been since tools/Dockerfile started installing the NDK - tools/README.md gives the
      # opposite instruction, rebuild the image rather than pass the flag. Left uncorrected, the one
      # document somebody reads when this step goes red was telling them the flag is expected here.
      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
